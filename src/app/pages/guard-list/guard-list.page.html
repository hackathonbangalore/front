<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Security Guards</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Security Guards</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-grid fixed>
    <ion-row>
      @for (guard of guards; track guard.id) {
      <ion-col size="12" size-md="6">
        <ion-card class="guard-card">
          <ion-card-header>
            <ion-item
              detail="false"
              lines="none"
              class="guard-item"
              routerLink="/app/tabs/guards/guard-details/{{guard.id}}"
            >
              <ion-avatar slot="start">
                <img
                  [src]="guard.profilePic"
                  [alt]="guard.name + ' profile picture'"
                />
              </ion-avatar>
              <ion-label>
                <h2>{{guard.name}}</h2>
                <p>{{guard.position}}</p>
                <ion-badge
                  [color]="getStatusColor(guard.status)"
                  class="status-badge"
                >
                  {{guard.status}}
                </ion-badge>
              </ion-label>
            </ion-item>
          </ion-card-header>

          <ion-card-content>
            <ion-list lines="none">
              <ion-item detail="false">
                <ion-icon
                  name="location"
                  slot="start"
                  color="primary"
                ></ion-icon>
                <ion-label>
                  <h3>Current Zone</h3>
                  <p>{{guard.currentZone}}</p>
                </ion-label>
              </ion-item>

              <ion-item detail="false">
                <ion-icon name="time" slot="start" color="medium"></ion-icon>
                <ion-label>
                  <h3>Shift</h3>
                  <p>{{guard.shiftStart}} - {{guard.shiftEnd}}</p>
                </ion-label>
              </ion-item>

              <ion-item detail="false">
                <ion-icon
                  name="shield-checkmark"
                  slot="start"
                  color="success"
                ></ion-icon>
                <ion-label>
                  <h3>Experience</h3>
                  <p>{{guard.experience}} years</p>
                </ion-label>
              </ion-item>

              <ion-item
                detail="false"
                routerLink="/app/tabs/guards/guard-details/{{guard.id}}"
                class="view-details-item"
              >
                <ion-icon name="person" slot="start" color="primary"></ion-icon>
                <ion-label>
                  <h3>View Details</h3>
                </ion-label>
                <ion-icon
                  name="chevron-forward"
                  slot="end"
                  color="medium"
                ></ion-icon>
              </ion-item>
            </ion-list>
          </ion-card-content>
        </ion-card>
      </ion-col>
      }
    </ion-row>
  </ion-grid>

  <!-- Floating Action Button -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button color="primary" (click)="addNewGuard()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
